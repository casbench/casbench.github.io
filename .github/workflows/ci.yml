name: CI

# Light checks only: the benches themselves run on a dedicated machine (see
# README.md) and their results are committed. This workflow checks that the
# committed LaTeX tables and the figure are exactly what make_tables.jl
# produces from the committed results, and that the site generator passes
# its tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tables:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - name: Regenerate the tables from the committed results
        run: |
          mkdir -p "$RUNNER_TEMP/tables" "$RUNNER_TEMP/figures"
          BENCH_TABLES_DIR="$RUNNER_TEMP/tables" BENCH_FIGURES_DIR="$RUNNER_TEMP/figures" \
            julia --startup-file=no make_tables.jl
          diff -r tables "$RUNNER_TEMP/tables"
          diff -r figures "$RUNNER_TEMP/figures"
          git diff --exit-code results/summary.md results/history.tsv
      - name: Robust statistics tests
        run: julia --startup-file=no test/metrics.jl
      - name: Simplification checks
        run: |
          julia --startup-file=no test/simplify.jl
          julia --startup-file=no test/zero_recognition.jl
      - name: Record compatibility tests
        run: |
          julia --startup-file=no test/records.jl
          julia --startup-file=no test/verify_supervisor.jl
          julia --startup-file=no test/adapter_syntax.jl
          julia --startup-file=no test/groebner_hard.jl
          julia --startup-file=no test/rur.jl
      - name: Numeric integration checks
        run: |
          julia --startup-file=no --project=envs/subprocess -e 'using Pkg; Pkg.instantiate()'
          julia --startup-file=no --project=envs/subprocess test/integration_numeric.jl
          julia --startup-file=no --project=envs/subprocess test/integration_task_interface.jl F_integration
          julia --startup-file=no --project=envs/subprocess test/integration_task_interface.jl H_osr
      - name: Site and history tests
        run: |
          python3 -I tools/site/test_sitegen.py
          python3 -I tools/test_history_backfill.py
