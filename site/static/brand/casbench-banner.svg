<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t">
  <title id="t">Computer algebra system benchmarks: reproducible, verified, dated</title>
  <style>
    .m { font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .s { font-size: 13px; fill: #8A949E; }
  </style>
  <defs><pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#8A949E" stroke-opacity="0.13" stroke-width="0.5"/></pattern></defs>
  <rect width="1280" height="320" fill="#1E2329"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
<g transform="translate(56 62)">
<rect x="0" y="0" width="196" height="196" rx="11.8" fill="none" stroke="#8A949E" stroke-opacity="0.5" stroke-width="3.9"/>
<circle cx="32.7" cy="32.7" r="18.3" fill="#2E9E5B"/>
<circle cx="98.0" cy="32.7" r="18.3" fill="#2E9E5B"/>
<circle cx="163.3" cy="32.7" r="18.3" fill="none" stroke="#F2B705" stroke-width="5.9"/>
<circle cx="32.7" cy="98.0" r="18.3" fill="#2E9E5B"/>
<circle cx="163.3" cy="98.0" r="18.3" fill="#2E9E5B"/>
<circle cx="32.7" cy="163.3" r="18.3" fill="none" stroke="#F2B705" stroke-width="5.9"/>
<circle cx="98.0" cy="163.3" r="18.3" fill="#2E9E5B"/>
<circle cx="163.3" cy="163.3" r="18.3" fill="#2E9E5B"/>
</g>
  <text x="300" y="118" class="m" font-size="50" font-weight="700" fill="#F4F1EA">CAS <tspan font-weight="400" fill="#F2B705">benchmarks</tspan></text>
  <text x="302" y="152" class="m" font-size="17" fill="#8A949E">computer algebra systems compared</text>
  <text x="302" y="178" class="m" font-size="17" fill="#8A949E">reproducible · verified · dated</text>
  <text x="302" y="224" class="m" font-size="13" fill="#8A949E">every answer checked by a system-neutral test</text>
  <text x="302" y="244" class="m" font-size="13" fill="#8A949E">every input shown next to its output</text>
  <text x="302" y="264" class="m" font-size="13" fill="#8A949E">every run dated, its environment pinned</text>
<line x1="866" y1="50" x2="866" y2="260" stroke="#8A949E" stroke-opacity="0.25"/>
<text x="866" y="278" class="m s" text-anchor="middle">10 µs</text>
<line x1="987" y1="50" x2="987" y2="260" stroke="#8A949E" stroke-opacity="0.25"/>
<text x="987" y="278" class="m s" text-anchor="middle">1 ms</text>
<line x1="1109" y1="50" x2="1109" y2="260" stroke="#8A949E" stroke-opacity="0.25"/>
<text x="1109" y="278" class="m s" text-anchor="middle">100 ms</text>
<line x1="1230" y1="50" x2="1230" y2="260" stroke="#8A949E" stroke-opacity="0.25"/>
<text x="1230" y="278" class="m s" text-anchor="middle">10 s</text>
<text x="856" y="75" class="m s" text-anchor="end">integrate</text>
