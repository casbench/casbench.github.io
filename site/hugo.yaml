# Project site, deployed to GitHub Pages by .github/workflows/site.yml.
# Content is generated outside the repository by tools/site/sitegen.py from
# the results files; build with tools/site/build.sh OUT.
baseURL: https://s-celles.github.io/computer-algebra-system-benchmarks/
title: Computer algebra system benchmarks
languageCode: en
enableRobotsTXT: true
noBuildLock: true
disableKinds: [taxonomy, term]
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
menu:
  main:
    - name: Results
      pageRef: /results
      weight: 1
    - name: History
      pageRef: /history
      weight: 2
    - name: Systems
      pageRef: /systems
      weight: 3
    - name: Environment
      pageRef: /environment
      weight: 4
    - name: Methodology
      pageRef: /methodology
      weight: 5
    - name: GitHub
      url: https://github.com/s-celles/computer-algebra-system-benchmarks
      weight: 6
      params:
        icon: github
    - name: Search
      weight: 7
      params:
        type: search
params:
  description: Reproducible, verified and dated benchmarks of computer algebra systems (Julia packages, SymPy, Maxima, FriCAS, SageMath, Macaulay2). An individual, non-commercial project.
  navbar:
    displayTitle: true
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  page:
    width: wide
  footer:
    displayCopyright: false
    displayPoweredBy: false
