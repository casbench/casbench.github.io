# Project site, deployed to GitHub Pages by .github/workflows/site.yml.
# Content is generated outside the repository by tools/site/sitegen.py from
# the results files; build with tools/site/build.sh OUT.
baseURL: https://casbench.github.io/
title: Computer algebra system benchmarks
languageCode: en
enableRobotsTXT: true
noBuildLock: true
disableKinds: [taxonomy, term]
module:
  imports:
    - path: github.com/s-celles/site-kit   # first: its badge and hooks win over Hextra's (site-kit SK-MODULE)
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\\[', '\\]'], ['$$', '$$']]
          inline: [['\\(', '\\)']]
  highlight:
    noClasses: false
menu:
  main:            # site-kit SPEC 0.4, section 2: the registry, then History, Methodology, Disclosures, Docs, GitHub, Search
    - name: Results
      pageRef: /results
      weight: 1
    - name: History
      pageRef: /history
      weight: 2
    - name: Methodology
      pageRef: /methodology
      weight: 3
    - name: Disclosures
      pageRef: /disclosures
      weight: 4
    - name: Docs
      pageRef: /docs
      weight: 5
    - name: GitHub
      url: https://github.com/casbench/casbench.github.io
      weight: 6
      params:
        icon: github
    - name: Search
      weight: 7
      params:
        type: search
params:
  math:
    enable: true
    engine: katex
  description: Reproducible, verified and dated benchmarks of computer algebra systems. An individual, non-commercial project.
  siteKit:
    themeColor: "#173f66"
    icon: brand/casbench-mark.svg
  navbar:
    displayTitle: true
    width: full
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  page:
    width: full
  footer:
    width: full
    displayCopyright: false
    displayPoweredBy: false
